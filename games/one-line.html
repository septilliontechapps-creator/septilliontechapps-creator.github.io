<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>One Line</title><link rel="stylesheet" href="common.css">
<style>
:root{--bg:#262a36;--bg2:#161923;--cell:#56607a;--fill:#14c466;--head:#63ff98}
#wrap{position:relative;touch-action:none}
#grid{display:grid;gap:8px}
.c{border-radius:12px;background:var(--cell);transition:background .12s}
.c.v{background:var(--fill)}
.c.no{visibility:hidden}
#line{position:absolute;inset:0;pointer-events:none;overflow:visible}
.dot{position:absolute;border-radius:50%;background:var(--head);pointer-events:none;box-shadow:0 0 0 4px rgba(99,255,152,.25)}
</style></head><body>
<div class="jg-main" id="main"><div id="wrap"><div id="grid"></div><svg id="line"></svg><div class="dot" id="dot"></div></div></div>
<script src="common.js"></script>
<script>
(function(){
let level=JG.load('level',1),B,path=[],cs=60,drawing=false;
JG.init({id:'oneline',name:'One Line',onReplay:()=>start()});
function gen(n){
  if(n===1)return {w:4,h:1,cells:[0,1,2,3],start:0};
  if(n===2)return {w:3,h:2,cells:[0,1,2,3,4,5],start:0};
  const r=JG.rng(n*7919);
  const w=Math.min(6,3+Math.floor(n/5)),h=Math.min(7,w+(n%3===0?1:0));
  const want=Math.floor(w*h*Math.min(1,.62+n*.02));
  for(let tries=0;tries<200;tries++){
    const s=Math.floor(r()*w*h),seen=new Set([s]),p=[s];
    const nb=k=>{const x=k%w,y=Math.floor(k/w),o=[];if(x>0)o.push(k-1);if(x<w-1)o.push(k+1);if(y>0)o.push(k-w);if(y<h-1)o.push(k+w);return o};
    while(p.length<want){
      const c=nb(p[p.length-1]).filter(k=>!seen.has(k));if(!c.length)break;
      c.sort((a,b)=>nb(a).filter(k=>!seen.has(k)).length-nb(b).filter(k=>!seen.has(k)).length+(r()-.5)*1.2);
      const k=c[0];seen.add(k);p.push(k);
    }
    if(p.length>=want)return {w,h,cells:p,start:p[0]};
  }
  return gen(1);
}
function start(){
  B=gen(level);B.set=new Set(B.cells);path=[B.start];
  JG.stats([['Level',level]]);
  cs=Math.floor(Math.min((innerWidth-40-(B.w-1)*8)/B.w,(innerHeight*.6-(B.h-1)*8)/B.h,76));
  const g=document.getElementById('grid');
  g.style.gridTemplateColumns=`repeat(${B.w},${cs}px)`;g.style.gridTemplateRows=`repeat(${B.h},${cs}px)`;
  let h='';for(let k=0;k<B.w*B.h;k++)h+=`<div class="c${B.set.has(k)?'':' no'}" data-k="${k}"></div>`;
  g.innerHTML=h;draw();
}
function center(k){return [(k%B.w)*(cs+8)+cs/2,Math.floor(k/B.w)*(cs+8)+cs/2]}
function draw(){
  document.querySelectorAll('#grid .c').forEach(e=>e.classList.toggle('v',path.includes(+e.dataset.k)));
  const pts=path.map(center);
  document.getElementById('line').innerHTML=pts.length>1?`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#63ff98" stroke-width="${cs*.22}" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>`:'';
  const d=document.getElementById('dot'),[x,y]=pts[pts.length-1],s=cs*.62;
  Object.assign(d.style,{width:s+'px',height:s+'px',left:(x-s/2)+'px',top:(y-s/2)+'px'});
}
function cellAt(e){const el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.classList.contains('c')&&!el.classList.contains('no')?+el.dataset.k:null}
function adj(a,b){const ax=a%B.w,ay=Math.floor(a/B.w),bx=b%B.w,by=Math.floor(b/B.w);return Math.abs(ax-bx)+Math.abs(ay-by)===1}
const wrap=document.getElementById('wrap');
wrap.addEventListener('pointerdown',e=>{
  const k=cellAt(e);if(k==null)return;
  const i=path.indexOf(k);if(i<0)return;
  path=path.slice(0,i+1);drawing=true;draw();JG.tutDone();
  try{wrap.setPointerCapture(e.pointerId)}catch(_){}
});
wrap.addEventListener('pointermove',e=>{
  if(!drawing)return;const k=cellAt(e);if(k==null)return;
  const head=path[path.length-1];if(k===head)return;
  if(path.length>1&&k===path[path.length-2]){path.pop();draw();return}
  if(adj(head,k)&&!path.includes(k)){path.push(k);JG.tone(440+path.length*18,.05,'sine',.06);JG.vibrate();draw();
    if(path.length===B.cells.length){drawing=false;setTimeout(win,250)}}
});
addEventListener('pointerup',()=>drawing=false);
function win(){
  JG.result({win:true,title:'Level Complete!',lines:['Level '+level+' solved'],buttons:[{label:'Next Level',fn:()=>{level++;JG.save('level',level);start()}}]});
}
start();
JG.tutorial('Drag a single line from the starting point to fill all the squares!',()=>document.querySelector(`.c[data-k="${B.start}"]`),'bottom');
})();
</script></body></html>
