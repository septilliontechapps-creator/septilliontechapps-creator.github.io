<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mahjong</title><link rel="stylesheet" href="common.css">
<style>
:root{--bg:#1c3a40;--bg2:#10252a;--tipbg:#1f4d45;--accent:#8fe3d0;--panel:rgba(255,255,255,.1)}
body{background:radial-gradient(100% 70% at 50% 30%,#285058,#152c31)}
#board{position:relative}
.tl{position:absolute;border-radius:9px;background:linear-gradient(#fffdf6,#ece6d6);display:grid;place-items:center;cursor:pointer;
  box-shadow:3px 4px 0 #b9ae93,4px 6px 0 #2f8f74,6px 9px 10px rgba(0,0,0,.35);font-size:calc(var(--tw)*.56);line-height:1;transition:transform .12s,filter .15s}
.tl.lock{filter:brightness(.72)}
.tl.sel{background:linear-gradient(#fff6b8,#ffe36e);transform:translateY(-3px)}
.tl.hint{animation:hint .6s 3}
@keyframes hint{50%{transform:scale(1.1)}}
.tl.out{animation:out .25s forwards}
@keyframes out{to{transform:scale(.3);opacity:0}}
</style></head><body>
<div class="jg-main" id="main"><div id="board"></div>
<div class="jg-bar" style="margin-top:22px"><button class="jg-btn" id="hint"></button><button class="jg-btn" id="shuf"></button></div></div>
<script src="common.js"></script>
<script>
(function(){
const SYM=['🌸','🍀','⭐','🌙','🔔','🎋','🐟','🍄','💎','👑','🔥','🎈','🌼','🐚','🍁','🦋','🍉','🎐'];
let level=JG.load('level',1),T=[],sel=null,score=0,tw=50,th=62;
JG.init({id:'mahjong',name:'Mahjong',onReplay:()=>start()});
const $=id=>document.getElementById(id);
$('hint').innerHTML=JG.ICON.bulb+' Hint';$('shuf').innerHTML=JG.ICON.shuffle+' Shuffle';
function layout(){
  if(level===1){ // small cross like the classic starter
    return [[2,0,0],[4,0,0],[0,2,0],[2,2,0],[4,2,0],[6,2,0],[0,4,0],[2,4,0],[4,4,0],[6,4,0],[2,6,0],[4,6,0],[1,3,1],[5,3,1]];
  }
  const w=Math.min(6,3+Math.floor(level/2)),h=Math.min(6,3+Math.floor((level-1)/2)),P=[];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)P.push([x*2,y*2,0]);
  if(w>2&&h>2)for(let y=0;y<h-1;y++)for(let x=0;x<w-1;x++)if(level>=3||((x+y)%2===0))P.push([x*2+1,y*2+1,1]);
  if(level>=4&&w>3&&h>3)for(let y=1;y<h-2;y++)for(let x=1;x<w-2;x++)P.push([x*2+2,y*2+2,2]);
  if(P.length%2)P.shift();
  return P;
}
function free(t,list){
  if(list.some(o=>o!==t&&o.z===t.z+1&&Math.abs(o.x-t.x)<2&&Math.abs(o.y-t.y)<2))return false;
  const side=d=>list.some(o=>o!==t&&o.z===t.z&&o.x===t.x+d&&Math.abs(o.y-t.y)<2);
  return !side(-2)||!side(2);
}
function deal(P){
  for(let tries=0;tries<200;tries++){
    let rest=P.map(([x,y,z])=>({x,y,z,s:-1})),out=[],ok=true;
    const types=Math.min(SYM.length,Math.max(4,Math.floor(P.length/4)));let k=0;
    while(rest.length){
      const f=rest.filter(t=>free(t,rest));if(f.length<2){ok=false;break}
      JG.shuffle(f);const s=(k++)%types;f[0].s=s;f[1].s=s;out.push(f[0],f[1]);rest=rest.filter(t=>t!==f[0]&&t!==f[1]);
    }
    if(ok)return out;
  }
  return [];
}
function start(){T=deal(layout());sel=null;score=0;size();render()}
function size(){
  const maxX=Math.max(...T.map(t=>t.x))+2,maxY=Math.max(...T.map(t=>t.y))+2;
  const main=$('main').getBoundingClientRect();
  tw=Math.floor(Math.min((Math.min(innerWidth,460)-40)/(maxX/2),(main.height-120)/(maxY/2)/1.24,70));th=Math.round(tw*1.24);
  const b=$('board');b.style.width=(maxX/2*tw+10)+'px';b.style.height=(maxY/2*th+14)+'px';b.style.setProperty('--tw',tw+'px');
}
function pairs(){const f=T.filter(t=>free(t,T));let n=0;for(let i=0;i<f.length;i++)for(let j=i+1;j<f.length;j++)if(f[i].s===f[j].s)n++;return n}
function render(){
  const b=$('board');
  const order=T.map((t,i)=>i).sort((a,c)=>T[a].z-T[c].z||T[a].y-T[c].y||T[a].x-T[c].x);
  b.innerHTML=order.map(i=>{const t=T[i];return `<div class="tl${free(t,T)?'':' lock'}${sel===i?' sel':''}" data-i="${i}" style="left:${t.x/2*tw-t.z*4}px;top:${t.y/2*th-t.z*6}px;width:${tw-3}px;height:${th-3}px;z-index:${t.z*100+t.y}">${SYM[t.s]}</div>`}).join('');
  JG.stats([['Level',level],['Score',score],['Matches',pairs()]]);
}
$('board').addEventListener('click',e=>{
  const el=e.target.closest('.tl');if(!el)return;const i=+el.dataset.i,t=T[i];
  if(!free(t,T)){JG.SFX.bad();return}
  JG.tutDone();
  if(sel===null||sel===i){sel=sel===i?null:i;JG.SFX.tap();render();return}
  if(T[sel].s===t.s){
    const a=T[sel];sel=null;T=T.filter(x=>x!==a&&x!==t);score+=20;JG.SFX.good();JG.vibrate();render();
    if(!T.length)return setTimeout(()=>JG.result({win:true,title:'Level Complete!',lines:['Score '+score],buttons:[{label:'Next Level',fn:()=>{level++;JG.save('level',level);start()}}]}),250);
    if(!pairs()){JG.toast('Shuffling…');reshuffle()}
  }else{sel=i;JG.SFX.tap();render()}
});
function reshuffle(){const pos=T.map(t=>[t.x,t.y,t.z]);const nd=deal(pos);if(nd.length)T=nd;sel=null;render()}
$('hint').onclick=()=>{const f=T.map((t,i)=>i).filter(i=>free(T[i],T));for(let a of f)for(let b of f)if(a<b&&T[a].s===T[b].s){[a,b].forEach(i=>{const el=document.querySelector(`.tl[data-i="${i}"]`);el&&el.classList.add('hint')});JG.SFX.tap();return}};
$('shuf').onclick=()=>{JG.SFX.tap();reshuffle()};
start();
JG.tutorial('Tap two identical free tiles to match and remove them.',()=>{const i=T.findIndex(t=>free(t,T));return document.querySelector(`.tl[data-i="${i}"]`)},'top');
})();
</script></body></html>
