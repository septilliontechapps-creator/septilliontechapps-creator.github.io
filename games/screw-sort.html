<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Screw Sort</title><link rel="stylesheet" href="common.css">
<style>
:root{--bg:#2b3240;--bg2:#1a1f29;--tipbg:#f08a24;--accent:#ffb347;--panel:rgba(255,255,255,.1)}
body{background:radial-gradient(120% 80% at 50% 0%,#3a4456,#232935)}
#bolts{display:flex;flex-wrap:wrap;justify-content:center;gap:26px 18px;max-width:440px}
.bolt{width:var(--nw);height:calc(var(--nh)*4.6 + 26px);position:relative;cursor:pointer}
.rod{position:absolute;left:50%;bottom:14px;width:calc(var(--nw)*.22);height:calc(100% - 14px);transform:translateX(-50%);border-radius:6px 6px 0 0;
  background:repeating-linear-gradient(170deg,#cfd6df 0 4px,#8e98a6 4px 7px)}
.base{position:absolute;left:-8px;right:-8px;bottom:0;height:16px;border-radius:8px;background:linear-gradient(#a8b1be,#6b7483);box-shadow:0 4px 0 rgba(0,0,0,.3)}
.nut{position:absolute;left:0;width:var(--nw);height:var(--nh);transition:bottom .18s cubic-bezier(.3,1.4,.6,1)}
.nut svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.bolt.done .base{background:linear-gradient(#7dff9a,#2fb34f)}
</style></head><body>
<div class="jg-main" id="main"><div id="bolts"></div>
<div class="jg-bar" style="margin-top:24px"><button class="jg-btn" id="undo"></button><button class="jg-btn" id="add"></button><button class="jg-btn" id="rs"></button></div></div>
<script src="common.js"></script><script src="sort-engine.js"></script>
<script>
(function(){
const CAP=4,COL=['#e8323f','#ffd21a','#2f8cff','#39c45a','#ff8a1f','#b04dff','#ff6fb5','#23d1d1','#a0673a','#e8ecf2','#223d9e'];
let level=JG.load('level',1),T,sel=null,hist=[],added=false;
JG.init({id:'screw',name:'Screw Sort',onReplay:()=>start()});
const $=id=>document.getElementById(id);
$('undo').innerHTML=JG.ICON.undo+' Undo';$('add').innerHTML=JG.ICON.plus+' Bolt';$('rs').innerHTML=JG.ICON.replay+' Restart';
function nutSVG(c){return `<svg viewBox="0 0 100 40"><path d="M12 4h76l10 16-10 16H12L2 20z" fill="${c}" stroke="rgba(0,0,0,.35)" stroke-width="3"/><path d="M14 8h72" stroke="rgba(255,255,255,.55)" stroke-width="4" stroke-linecap="round"/><rect x="40" y="8" width="20" height="24" rx="4" fill="rgba(0,0,0,.18)"/></svg>`}
function start(){T=SortEngine.gen(level,CAP,[[0,0],[0,0,1,1],[1,1]]);sel=null;hist=[];added=false;$('add').disabled=false;JG.stats([['Level',level]]);render()}
function render(){
  const n=T.length,per=Math.min(n,level<=2?3:5),nw=Math.max(46,Math.min(74,Math.floor((Math.min(innerWidth,440)-20)/per)-22)),nh=Math.round(nw*.4);
  const box=$('bolts');box.style.setProperty('--nw',nw+'px');box.style.setProperty('--nh',nh+'px');
  box.innerHTML=T.map((t,i)=>{
    const tp=SortEngine.top(t),lift=sel===i;
    return `<div class="bolt${t.length===CAP&&t.every(c=>c===t[0])?' done':''}" data-i="${i}"><div class="rod"></div><div class="base"></div>${t.map((c,k)=>{
      const up=lift&&k>=t.length-tp.k;return `<div class="nut" style="bottom:${14+k*(nh+2)+(up?nh*1.4:0)}px">${nutSVG(COL[c])}</div>`}).join('')}</div>`}).join('');
}
$('bolts').addEventListener('click',e=>{
  const b=e.target.closest('.bolt');if(!b)return;const i=+b.dataset.i;
  if(sel===null){if(!T[i].length)return;sel=i;JG.tone(700,.05,'square',.04);render();JG.tutDone();return}
  if(sel===i){sel=null;render();return}
  if(SortEngine.canPour(T[sel],T[i],CAP)){hist.push(JSON.stringify(T));SortEngine.pour(T[sel],T[i],CAP);sel=null;JG.tone(900,.06,'square',.04);JG.tone(1200,.05,'square',.03,.06);JG.vibrate();render();
    const d=T[i];if(d.length===CAP&&d.every(c=>c===d[0]))JG.SFX.good();
    if(SortEngine.solved(T,CAP))setTimeout(()=>JG.result({win:true,title:'Level Complete!',lines:['Level '+level+' sorted'],buttons:[{label:'Next Level',fn:()=>{level++;JG.save('level',level);start()}}]}),400);
    else if(!SortEngine.anyMove(T,CAP))setTimeout(()=>JG.toast('Stuck! Undo or add a bolt'),200);
  }else{JG.SFX.bad();sel=T[i].length?i:null;render()}
});
$('undo').onclick=()=>{if(!hist.length)return;T=JSON.parse(hist.pop());sel=null;JG.SFX.tap();render()};
$('add').onclick=()=>{if(added)return;added=true;T.push([]);$('add').disabled=true;JG.SFX.tap();render()};
$('rs').onclick=()=>{JG.SFX.tap();start()};
start();
JG.tutorial('Tap a bolt, then tap another bolt to move the nuts',()=>document.querySelector('.bolt[data-i="1"]'),'bottom');
})();
</script></body></html>
