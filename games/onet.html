<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Onet</title><link rel="stylesheet" href="common.css">
<style>
:root{--bg:#33262b;--bg2:#221a1d;--tipbg:#e8698e;--accent:#ff9ab8;--panel:rgba(255,255,255,.1)}
#wrap{position:relative}
#grid{display:grid;gap:5px}
.t{border-radius:10px;background:#f6ecdf;box-shadow:inset 0 -5px 0 #cdbba6;display:grid;place-items:center;cursor:pointer;font-size:calc(var(--ts)*.62);line-height:1;transition:transform .12s,opacity .2s}
.t.sel{background:#fff;transform:translateY(-3px);box-shadow:inset 0 -5px 0 #cdbba6,0 0 0 3px #ff9ab8}
.t.hint{animation:hint .6s ease-in-out 3}
@keyframes hint{50%{transform:scale(1.12)}}
.t.gone{visibility:hidden}
#ln{position:absolute;inset:0;pointer-events:none;overflow:visible}
</style></head><body>
<div class="jg-main" id="main"><div id="wrap"><div id="grid"></div><svg id="ln"></svg></div>
<div class="jg-bar" style="margin-top:18px"><button class="jg-btn" id="hint"></button><button class="jg-btn" id="shuf"></button></div></div>
<script src="common.js"></script>
<script>
(function(){
const ICONS=['🍍','🍓','🍉','🍊','🫐','🍐','🥝','🥑','🍒','🍋','🍇','🍎','🍑','🥥','🍌','🥭','🍈','🌽'];
let level=JG.load('level',1),R,C,G,sel=null,ts=48,score=0;
JG.init({id:'onet',name:'Onet',onReplay:()=>start()});
const $=id=>document.getElementById(id);
$('hint').innerHTML=JG.ICON.bulb+' Hint';$('shuf').innerHTML=JG.ICON.shuffle+' Shuffle';
function start(){
  [R,C]=level===1?[4,4]:level===2?[6,4]:level<5?[6,6]:[8,6];
  const pairs=R*C/2,types=Math.min(ICONS.length,Math.max(4,Math.floor(pairs/2)+level%4));
  let arr=[];for(let i=0;i<pairs;i++){const k=i%types;arr.push(k,k)}
  JG.shuffle(arr);G=[];for(let r=0;r<R+2;r++){G.push([]);for(let c=0;c<C+2;c++)G[r].push(r&&c&&r<=R&&c<=C?arr.pop():-1)}
  sel=null;score=0;ensureMove();layout();
}
function layout(){
  const main=$('main').getBoundingClientRect();
  ts=Math.floor(Math.min((Math.min(innerWidth,440)-24-(C-1)*5)/C,(main.height-110-(R-1)*5)/R,64));
  const g=$('grid');g.style.gridTemplateColumns=`repeat(${C},${ts}px)`;g.style.gridTemplateRows=`repeat(${R},${ts}px)`;g.style.setProperty('--ts',ts+'px');
  render();
}
function render(){
  let h='';for(let r=1;r<=R;r++)for(let c=1;c<=C;c++){const v=G[r][c];h+=`<div class="t${v<0?' gone':''}${sel&&sel[0]===r&&sel[1]===c?' sel':''}" data-r="${r}" data-c="${c}">${v<0?'':ICONS[v]}</div>`}
  $('grid').innerHTML=h;JG.stats([['Level',level],['Score',score]]);
}
function path(a,b){
  const D=[[0,1],[1,0],[0,-1],[-1,0]],H=R+2,Wd=C+2;
  const best={};const q=[];
  for(let d=0;d<4;d++)q.push([a[0],a[1],d,0,[[a[0],a[1]]]]);
  while(q.length){
    const [r,c,d,t,p]=q.shift();
    const nr=r+D[d][0],nc=c+D[d][1];
    if(nr<0||nc<0||nr>=H||nc>=Wd)continue;
    const np=p.concat([[nr,nc]]);
    if(nr===b[0]&&nc===b[1])return np;
    if(G[nr][nc]>=0)continue;
    const key=nr+','+nc+','+d;if(best[key]!=null&&best[key]<=t)continue;best[key]=t;
    for(let d2=0;d2<4;d2++){if((d2+2)%4===d)continue;const t2=t+(d2===d?0:1);if(t2>2)continue;q.push([nr,nc,d2,t2,d2===d?np:np])}
  }
  return null;
}
function findPair(){
  const cells=[];for(let r=1;r<=R;r++)for(let c=1;c<=C;c++)if(G[r][c]>=0)cells.push([r,c]);
  for(let i=0;i<cells.length;i++)for(let j=i+1;j<cells.length;j++){const a=cells[i],b=cells[j];if(G[a[0]][a[1]]===G[b[0]][b[1]]&&path(a,b))return [a,b]}
  return null;
}
function reshuffle(){const cells=[],vals=[];for(let r=1;r<=R;r++)for(let c=1;c<=C;c++)if(G[r][c]>=0){cells.push([r,c]);vals.push(G[r][c])}JG.shuffle(vals);cells.forEach(([r,c],i)=>G[r][c]=vals[i])}
function ensureMove(){let n=0;while(!findPair()&&n<30&&remaining()){reshuffle();n++}}
function remaining(){let n=0;for(let r=1;r<=R;r++)for(let c=1;c<=C;c++)if(G[r][c]>=0)n++;return n}
function center([r,c]){return [(c-1)*(ts+5)+ts/2,(r-1)*(ts+5)+ts/2]}
$('grid').addEventListener('click',e=>{
  const t=e.target.closest('.t');if(!t||t.classList.contains('gone'))return;const p=[+t.dataset.r,+t.dataset.c];JG.tutDone();
  if(!sel||(sel[0]===p[0]&&sel[1]===p[1])){sel=sel?null:p;JG.SFX.tap();render();return}
  if(G[sel[0]][sel[1]]===G[p[0]][p[1]]){const pt=path(sel,p);if(pt){
    $('ln').innerHTML=`<polyline points="${pt.map(q=>center(q).join(',')).join(' ')}" fill="none" stroke="#ff9ab8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`;
    G[sel[0]][sel[1]]=-1;G[p[0]][p[1]]=-1;sel=null;score+=10;JG.SFX.good();JG.vibrate();render();
    setTimeout(()=>$('ln').innerHTML='',260);
    if(!remaining())return setTimeout(()=>JG.result({win:true,title:'Level Complete!',lines:['Score '+score],buttons:[{label:'Next Level',fn:()=>{level++;JG.save('level',level);start()}}]}),300);
    if(!findPair()){JG.toast('Shuffling…');ensureMove();render()}
    return}}
  JG.SFX.bad();sel=p;render();
});
$('hint').onclick=()=>{const p=findPair();if(!p)return;JG.SFX.tap();p.forEach(([r,c])=>{const el=document.querySelector(`.t[data-r="${r}"][data-c="${c}"]`);el&&el.classList.add('hint')})};
$('shuf').onclick=()=>{reshuffle();ensureMove();sel=null;JG.SFX.tap();render()};
start();
JG.tutorial('Tap two matching tiles to connect them',()=>{const p=findPair();return p&&document.querySelector(`.t[data-r="${p[0][0]}"][data-c="${p[0][1]}"]`)},'bottom');
})();
</script></body></html>
